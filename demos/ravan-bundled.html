<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravan Bundled Demo</title>
    <link rel="stylesheet" href="../dist/editor-content.min.css">
    <link rel="stylesheet" href="../dist/toolbar.min.css">
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --line: #d7dce3;
            --line-strong: #b9c1cc;
            --text: #1f2933;
            --muted: #637083;
            --accent-soft: #dbeafe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 20px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .shell {
            max-width: 840px;
            margin: 0 auto;
        }

        .heading {
            margin: 0 0 18px;
        }

        .heading h1 {
            margin: 0;
            font-size: 2rem;
            line-height: 1.1;
        }

        .heading p {
            margin: 10px 0 0;
            color: var(--muted);
        }

        .editor-frame {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 18px 42px rgba(31, 41, 51, 0.08);
        }

        @media (max-width: 640px) {
            body {
                padding: 18px 14px;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <div class="heading">
            <h1>Ravan Bundled Demo</h1>
            <p>This page loads the minified <code>dist/ravan.min.js</code> bundle.</p>
        </div>

        <div class="editor-frame">
            <div id="editor-wrapper">
                <p>This editor is mounted from the bundled Ravan build.</p>
                <p>Its toolbar is created automatically from the wrapper contents.</p>
                <p>Try formatting this text, adding a link, or inserting a table.</p>
            </div>

            <div class="status" aria-label="Current formatting context">
                <div id="statusBreadcrumb" class="status-breadcrumb" aria-live="polite">Editor</div>
            </div>
        </div>
    </main>

    <script src="../dist/ravan-loader.min.js"></script>
    <script>
        RavanLoader.mount('#editor-wrapper', {
            assets: {
                icons: {
                    url: '../src/ui/toolbar-icons.svg'
                }
            },
            codeView: {
                mode: 'after',
                editable: true,
                live: true
            },
            findReplace: {
                enabled: true
            },
            media: {
                fileBrowser: {
                    endpoint: '/files',
                    path: '/',
                    supportedExtensions: {
                        image: '.jpg,.jpeg,.png,.gif,.webp,.svg',
                        video: '.mp4,.webm,.ogv,.mov,.m4v',
                        audio: '.mp3,.wav,.ogg,.oga,.m4a,.aac,.flac'
                    }
                }
            },
            elements: {
                status: document.getElementById('statusBreadcrumb')
            }
        }, {
            mode: 'bundle',
            bundleUrl: '../dist/ravan.min.js'
        });
    </script>
</body>

</html>
