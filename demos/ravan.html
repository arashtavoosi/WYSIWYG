<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravan Editor</title>
    <link rel="stylesheet" href="../dist/editor-content.min.css">
    <link rel="stylesheet" href="../dist/toolbar.min.css">
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --line: #d7dce3;
            --line-strong: #b9c1cc;
            --text: #1f2933;
            --muted: #637083;
            --accent: #2563eb;
            --accent-soft: #dbeafe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 20px;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .shell {
            max-width: 840px;
            margin: 0 auto;
        }

        .heading {
            margin: 0 0 18px;
        }

        .heading h1 {
            margin: 0;
            font-size: 2rem;
            line-height: 1.1;
            letter-spacing: 0;
        }

        .heading p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .editor-frame {
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            background: var(--panel);
            box-shadow: 0 18px 42px rgba(31, 41, 51, 0.08);
        }

        @media (max-width: 640px) {
            body {
                padding: 18px 14px;
            }
        }
    </style>

</head>

<body>
    <div class="shell">
        <div class="heading">
            <h1>Ravan Editor</h1>
            <p>The smallest end-to-end demo now runs through <code>Ravan.mount</code>.</p>
        </div>

        <div class="editor-frame">
            <div id="editor-wrapper">
                <p>This is some <strong>bold</strong> and <em>italic</em> text.</p>
                <p>Select part of this paragraph to create a <a href="https://example.com">link</a>, convert it into a heading, or turn it into a list.</p>
                <p><table><thead><tr><th><br></th><th><br></th><th><br></th></tr></thead><tbody><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr></tbody></table><p><br></p><br></p>
            </div>

            <div class="status" aria-label="Current formatting context">
                <div id="statusBreadcrumb" class="status-breadcrumb" aria-live="polite">Editor</div>
            </div>
        </div>
    </div>

    <script src="../dist/ravan-loader.min.js"></script>
    <script>
        RavanLoader.mount('#editor-wrapper', {
            assets: {
                icons: {
                    url: '../src/ui/toolbar-icons.svg'
                }
            },
            codeView: {
                mode: 'after',
                editable: true,
                live: true
            },
            findReplace: {
                enabled: true
            },
            media: {
                fileBrowser: {
                    endpoint: '/files',
                    path: '/',
                    supportedExtensions: {
                        image: '.jpg,.jpeg,.png,.gif,.webp,.svg',
                        video: '.mp4,.webm,.ogv,.mov,.m4v',
                        audio: '.mp3,.wav,.ogg,.oga,.m4a,.aac,.flac'
                    }
                }
            },
            elements: {
                status: document.getElementById('statusBreadcrumb')
            }
        }, {
            mode: 'source',
            baseUrl: '../src/',
            minified: false,
            minifiedBaseUrl: '../dist/src/'
        });
    </script>
</body>

</html>
